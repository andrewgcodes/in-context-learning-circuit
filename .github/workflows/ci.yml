name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile icl/*.py figures/*.py toy/*.py
      - run: python -m pytest -q tests
      - run: mkdir -p /tmp/figs/figures && cd /tmp/figs && for f in $GITHUB_WORKSPACE/figures/fig*.py; do ICL_DATA=$GITHUB_WORKSPACE/data python $f; done && ls /tmp/figs/figures | wc -l
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y -q texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-science
      - run: make -C paper arxiv
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: |
            paper/main.pdf
            paper/arxiv.tar.gz
